<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bernd Dellwig - Engel & Völkers Marbella</title>
    <script src="https://kit.fontawesome.com/7f130d1a0b.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --ev-black: #111111;
            --ev-grey: #666666;
            --ev-light: #f9f9f9;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Text';
        }

        body {
            background-color: var(--ev-light);
            color: var(--ev-black);
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 100vh;
            padding: 10px;
        }

        @font-face {
            font-family: 'Text';
            src: url(./fonts/Text.ttf);
        }
        @font-face {
            font-family: 'Head';
            src: url(./fonts/Head.ttf);
        }
        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 0px; /* Estilo sobrio y recto de E&V */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid #eeeeee;
            padding: 20px 30px;
            text-align: center;
        }

        .logo {
            width: 90%;
            height: auto;
            margin-bottom: 5px;
            padding-bottom: 10px;
        }
        

        .profile-img {
            width: 170px;
            height: auto;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            padding: 3px;
        }

        .name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            font-family: 'Head';
        }

        .title {
            font-size: 13px;
            color: var(--ev-grey);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* Botón Principal: Guardar Contacto */
        .btn-main {
            display: block;
            background-color: var(--ev-black);
            color: var(--white);
            text-decoration: none;
            padding: 15px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: background 0.3s;
        }

        .btn-main:hover {
            background-color: #333333;
        }

        /* Botones de Enlace Secundarios */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-secondary {
            display: block;
            border: 1px solid var(--ev-black);
            color: var(--ev-black);
            text-decoration: none;
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background-color: var(--ev-black);
            color: var(--white);
        }
        .social{
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
        }
        .icono{
            font-size: 30px;
            margin-left: 3px;
        }
        a{
            text-decoration: none;
            color: #0d0d0d;
        }
    </style>
</head>
<body>

    <div class="card">
        <div >
            <img class="logo" src="./img/logo.png" alt="">
        </div>

        <img src="./img/bernd.png" alt="Bernd Dellwig" class="profile-img">

        <h1 class="name">Bernd Dellwig</h1>
        <p class="title">General Sales Director</p>

        <a href="contacto.vcf" download="Bernd_Dellwig_EV.vcf" class="btn-main">Save Contact</a>

        <div class="links-container">
            <a href="tel:+34625098788" class="btn-secondary">Call me</a>
            <a href="https://wa.me/34625098788" target="_blank" class="btn-secondary">WhatsApp Message</a>
            <a href="mailto:bernd.dellwig@engelvoelkers.com" class="btn-secondary">Send Email</a>
            <a href="https://www.marbella-ev.com" target="_blank" class="btn-secondary">Search Properties</a>
        </div>

        <div class="social">
            <a href="#"><i class="fa-brands fa-instagram icono"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin icono"></i></a>
        </div>
    </div>

</body>
</html>
