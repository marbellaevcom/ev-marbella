<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alejandro Pérez - Engel & Völkers Marbella</title>
    <style>
        :root {
            --ev-black: #111111;
            --ev-grey: #666666;
            --ev-light: #f9f9f9;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--ev-light);
            color: var(--ev-black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 0px; /* Estilo sobrio y recto de E&V */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #eeeeee;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 90%;
            height: auto;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--ev-black);
            padding-bottom: 10px;
        }
        
        .sub-logo {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--ev-grey);
            margin-bottom: 30px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid var(--ev-black);
            padding: 3px;
        }

        .name {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 13px;
            color: var(--ev-grey);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* Botón Principal: Guardar Contacto */
        .btn-main {
            display: block;
            background-color: var(--ev-black);
            color: var(--white);
            text-decoration: none;
            padding: 15px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 25px;
            transition: background 0.3s;
        }

        .btn-main:hover {
            background-color: #333333;
        }

        /* Botones de Enlace Secundarios */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-secondary {
            display: block;
            border: 1px solid var(--ev-black);
            color: var(--ev-black);
            text-decoration: none;
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background-color: var(--ev-black);
            color: var(--white);
        }
    </style>
</head>
<body>

    <div class="card">
        <div >
            <img class="logo" src="./img/logo.png" alt="">
        </div>

        <img src="perfil.jpg" alt="Alejandro Pérez" class="profile-img">

        <h1 class="name">Alejandro Pérez</h1>
        <p class="title">Real Estate Agent</p>

        <a href="contacto.vcf" download="Alejandro_Perez_EV.vcf" class="btn-main">Guardar Contacto</a>

        <div class="links-container">
            <a href="tel:+34600000000" class="btn-secondary">Llamar Teléfono</a>
            <a href="https://wa.me/34600000000?text=Hola%20Alejandro,%20estoy%20interesado%20en%20una%20propiedad" target="_blank" class="btn-secondary">Enviar WhatsApp</a>
            <a href="mailto:alejandro.perez@engelvoelkers.com" class="btn-secondary">Enviar Email</a>
            <a href="https://www.engelvoelkers.com/marbella/" target="_blank" class="btn-secondary">Ver Propiedades</a>
        </div>
    </div>

</body>
</html>
